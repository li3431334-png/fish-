<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>一封信</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 100% at 50% 0%, #222222 0%, #111111 50%, #000000 100%);
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }

  .scene { position: relative; width: 300px; height: 200px; }

  /* 微弱的白光 */
  .scene::before {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 440px; height: 440px; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255, 255, 255, 0.08), transparent 68%);
    z-index: -1; pointer-events: none;
  }

  /* ---------- 纯 CSS 花瓣雨 ---------- */
  .petals-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
    overflow: hidden;
    display: none; /* 默认隐藏 */
  }
  
  /* 只有信封打开时，才显示花瓣 */
  .envelope.open ~ .petals-container {
    display: block;
  }

  .petal {
    position: absolute;
    top: -20px;
    background: linear-gradient(135deg, #8bc6ff, #3f8cf5);
    border-radius: 50% 0 50% 50%;
    box-shadow: 0 0 8px rgba(139, 198, 255, 0.4);
    animation: fall linear infinite;
  }

  /* 用 nth-child 给每片花瓣分配不同的位置和速度，形成错落感 */
  .petal:nth-child(1) { left: 5%; width: 10px; height: 14px; animation-duration: 4s; animation-delay: 0s; }
  .petal:nth-child(2) { left: 15%; width: 14px; height: 20px; animation-duration: 6s; animation-delay: 1.5s; }
  .petal:nth-child(3) { left: 25%; width: 8px; height: 12px; animation-duration: 5s; animation-delay: 0.5s; }
  .petal:nth-child(4) { left: 35%; width: 12px; height: 18px; animation-duration: 7s; animation-delay: 2s; }
  .petal:nth-child(5) { left: 45%; width: 9px; height: 13px; animation-duration: 4.5s; animation-delay: 1s; }
  .petal:nth-child(6) { left: 55%; width: 15px; height: 22px; animation-duration: 6.5s; animation-delay: 0.2s; }
  .petal:nth-child(7) { left: 65%; width: 11px; height: 16px; animation-duration: 5.5s; animation-delay: 1.8s; }
  .petal:nth-child(8) { left: 75%; width: 13px; height: 19px; animation-duration: 8s; animation-delay: 0.8s; }
  .petal:nth-child(9) { left: 85%; width: 8px; height: 12px; animation-duration: 4s; animation-delay: 2.5s; }
  .petal:nth-child(10) { left: 95%; width: 12px; height: 18px; animation-duration: 6s; animation-delay: 1.2s; }
  .petal:nth-child(11) { left: 10%; width: 10px; height: 15px; animation-duration: 5s; animation-delay: 3s; }
  .petal:nth-child(12) { left: 30%; width: 14px; height: 21px; animation-duration: 7s; animation-delay: 0.6s; }
  .petal:nth-child(13) { left: 60%; width: 9px; height: 14px; animation-duration: 4.5s; animation-delay: 2.2s; }
  .petal:nth-child(14) { left: 80%; width: 11px; height: 17px; animation-duration: 6s; animation-delay: 1.8s; }
  .petal:nth-child(15) { left: 50%; width: 15px; height: 23px; animation-duration: 8s; animation-delay: 0.4s; }

  /* 下落并带有左右摇摆的动画 */
  @keyframes fall {
    0% { top: -10%; transform: translateX(0) rotate(0deg); opacity: 1; }
    50% { transform: translateX(20px) rotate(90deg); }
    100% { top: 110%; transform: translateX(-20px) rotate(180deg); opacity: 0; }
  }

  /* --------------------------------- */

  .envelope {
    position: relative; width: 100%; height: 100%;
    perspective: 900px; cursor: pointer; outline: none;
    -webkit-tap-highlight-color: transparent;
  }

  .env-back {
    position: absolute; inset: 0;
    background: linear-gradient(165deg, #ffffff 0%, #e6e6e6 100%);
    box-shadow: 0 0 40px rgba(255, 255, 255, 0.15), 0 20px 44px -16px rgba(0, 0, 0, 0.8);
    z-index: 1; transition: box-shadow 0.45s ease;
  }

  .envelope:hover .env-back {
    box-shadow: 0 0 60px rgba(255, 255, 255, 0.25), 0 26px 54px -16px rgba(0, 0, 0, 0.9);
  }

  .pocket {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #ffffff 0%, #d9d9d9 100%);
    clip-path: polygon(0 40%, 100% 40%, 100% 100%, 0 100%);
    -webkit-clip-path: polygon(0 40%, 100% 40%, 100% 100%, 0 100%);
    box-shadow: inset 0 3px 12px rgba(0, 0, 0, 0.06);
    z-index: 3;
  }

  .flap {
    position: absolute; top: 0; left: 0; width: 100%; height: 96px;
    background: linear-gradient(180deg, #ffffff 0%, #e0e0e0 100%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    -webkit-clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: 50% 0; transform: rotateX(0deg);
    transition: transform 0.72s cubic-bezier(0.65, 0.05, 0.36, 1), z-index 0s;
    z-index: 5;
  }

  .envelope.open .flap {
    transform: rotateX(-180deg); z-index: 0;
    transi
